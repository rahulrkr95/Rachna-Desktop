name: Build Rachna IDE

# Runs on every commit to every branch, plus manual runs from the Actions tab.
# If you only want this on your default branch, change `branches` below to
# something like `branches: [main]`.
on:
  push:
    branches:
      - '**'
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: windows-x64
          - platform: macos-latest
            label: macos-universal
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            label: linux-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Tauri v2 on Linux needs webkit2gtk + appindicator + rsvg + patchelf.
      # keyring's "sync-secret-service" feature additionally needs libdbus/libsecret.
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libdbus-1-dev \
            libsecret-1-dev

      - name: npm install
        run: npm install

      - name: npm run scanner:build
        run: npm run scanner:build

      - name: npm run tauri build
        env:
          # Required for the updater plugin to actually produce signed
          # update artifacts (.sig files + the updater-compatible bundle
          # formats) alongside the normal installers. Set these two as
          # repo secrets: Settings -> Secrets and variables -> Actions ->
          # New repository secret. Without them, `tauri build` still
          # produces the regular installers, it just silently skips
          # generating anything the updater plugin can use.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rachna-ide-${{ matrix.label }}
          path: src-tauri/target/**/release/bundle/**
          if-no-files-found: error

      # Wraps the MSI produced above into a single bootstrapper:
      #   Rachna AI Studio Setup.exe
      #        +-- check/install WebView2 Runtime
      #        +-- check/install VC++ x64 Redistributable
      #        +-- msiexec /i <the MSI>
      # See src-tauri/windows/bootstrapper/setup.nsi for details.
      - name: Install NSIS
        if: matrix.platform == 'windows-latest'
        run: choco install nsis -y --no-progress

      - name: Build Setup.exe bootstrapper
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter *.msi -Recurse |
            Select-Object -First 1
          if (-not $msi) {
            throw "No .msi found under src-tauri/target/release/bundle/msi"
          }
          Write-Host "Found MSI: $($msi.FullName)"

          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          Write-Host "App version: $version"

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $outFile = "dist/Rachna AI Studio Setup.exe"

          & "C:\Program Files (x86)\NSIS\makensis.exe" `
            "/DMSI_PATH=$($msi.FullName)" `
            "/DAPP_VERSION=$version" `
            "/DOUT_FILE=$outFile" `
            "src-tauri\windows\bootstrapper\setup.nsi"

          if ($LASTEXITCODE -ne 0) {
            throw "makensis failed with exit code $LASTEXITCODE"
          }

      - name: Upload Setup.exe
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: rachna-ide-windows-x64-setup
          path: dist/Rachna AI Studio Setup.exe
          if-no-files-found: error